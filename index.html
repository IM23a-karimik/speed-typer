<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedTyper</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
      <header>
        <div class="logo">⌨️ MonkeyTyper</div>
        <div class="menu">
          <div class="mode-selector">
            <button class="mode-btn active" data-mode="time">@ Zeit</button>
            <button class="mode-btn" data-mode="words">A Wörter</button>
          </div>

          <div class="value-selector" id="time-values">
            <button class="val-btn" data-val="15">15</button>
            <button class="val-btn active" data-val="30">30</button>
            <button class="val-btn" data-val="60">60</button>
          </div>

          <div class="value-selector hidden" id="word-values">
            <button class="val-btn" data-val="10">10</button>
            <button class="val-btn active" data-val="25">25</button>
            <button class="val-btn" data-val="50">50</button>
          </div>
        </div>
      </header>

      <div id="time-display" class="stat">30</div>

      <div id="typing-area"></div>

      <div class="controls">
        <button id="restart-btn" title="Neustart">↻ Neustart</button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
