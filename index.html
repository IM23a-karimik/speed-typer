<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedTyper</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <header class="main-header">
        <div class="brand">
          <span class="bolt">⚡</span>
          <h1>Speed<span>Typer</span></h1>
        </div>

        <nav class="game-settings">
          <div class="setting-group" id="mode-select">
            <button class="mode-btn active" data-mode="time">Zeit</button>
            <button class="mode-btn" data-mode="words">Wörter</button>
          </div>
          <div class="divider"></div>
          <div class="setting-group" id="value-select">
            <button class="val-btn active" data-val="5">5</button>
            <button class="val-btn" data-val="10">10</button>
            <button class="val-btn" data-val="20">20</button>
            <button class="val-btn" data-val="30">30</button>
          </div>
        </nav>
      </header>

      <main class="game-core">
        <div id="status-line" class="status-line">5</div>

        <div class="typing-container">
          <div id="typing-area" class="typing-area"></div>
        </div>

        <div class="action-area">
          <button id="restart-btn" class="btn-primary"><span class="icon">↻</span> Neustart</button>
        </div>
      </main>
    </div>

    <div id="result-modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-modal" class="close-btn" title="Schließen">✖</button>
        <h2>Spiel beendet!</h2>

        <div class="result-stats">
          <div class="stat-box">
            <div class="stat-label">WPM</div>
            <div id="final-wpm" class="stat-value wpm-color">0</div>
          </div>

          <div class="stat-box">
            <div class="stat-label">Genauigkeit</div>
            <div id="final-acc" class="stat-value">100%</div>
          </div>

          <div class="stat-box">
            <div class="stat-label">Fehler</div>
            <div id="final-errors" class="stat-value error-color">0</div>
          </div>
        </div>

        <button id="modal-restart-btn" class="btn-primary mt-4">
          <span class="icon">↻</span> Neue Runde
        </button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
