<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedTyper</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>SpeedTyper</h1>

      <div class="stats-container">
        <div class="stat-box">Zeit: <span id="timer">10</span>s</div>
        <div class="stat-box">WPM: <span id="wpm">0</span></div>
      </div>

      <div class="quote-container">
        <div id="typing-window" class="typing-window">
          <div id="text-track" class="text-track"></div>
        </div>
      </div>
      <button id="restart-btn">Neustart</button>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
