<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeedTyper</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <header class="main-header">
        <div class="brand">
          <span class="bolt">⚡</span>
          <h1>Speed<span>Typer</span></h1>
        </div>

        <button id="settings-btn" class="icon-btn" title="Einstellungen">⚙️</button>
      </header>

      <main class="game-core">
        <div id="status-line" class="status-line">5</div>

        <div class="progress-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="typing-container">
          <div id="typing-area" class="typing-area"></div>
        </div>

        <div class="action-area">
          <button id="restart-btn" class="btn-primary"><span class="icon">↻</span> Neustart</button>
        </div>
      </main>
    </div>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-content settings-content">
        <div id="view-main" class="settings-view">
          <button class="close-btn close-all-btn" title="Schließen">✖</button>
          <h2>Einstellungen</h2>
          <div class="settings-layout">
            <button class="settings-nav-btn" data-target="view-lang">🌍 Spracheinstellungen</button>
            <button class="settings-nav-btn" data-target="view-theme">🎨 Farbschema ändern</button>
            <button class="settings-nav-btn" data-target="view-mode">⏱️ Modus & Dauer</button>
          </div>
        </div>

        <div id="view-lang" class="settings-view hidden">
          <button class="back-btn" title="Zurück">⬅</button>
          <button class="close-btn close-all-btn" title="Schließen">✖</button>
          <h2>Sprache</h2>
          <div class="settings-layout">
            <div class="setting-group" id="lang-select">
              <button class="lang-btn active" data-lang="de">Deutsch</button>
              <button class="lang-btn" data-lang="en">English</button>
              <button class="lang-btn" data-lang="es">Español</button>
            </div>
          </div>
        </div>

        <div id="view-theme" class="settings-view hidden">
          <button class="back-btn" title="Zurück">⬅</button>
          <button class="close-btn close-all-btn" title="Schließen">✖</button>
          <h2>Farbschema</h2>
          <div class="settings-layout">
            <div class="setting-group" id="theme-select">
              <button class="theme-btn active" data-theme="default">Cyber</button>
              <button class="theme-btn" data-theme="theme-light">Light</button>
              <button class="theme-btn" data-theme="theme-neon">Neon</button>
              <button class="theme-btn" data-theme="theme-matrix">Matrix</button>
            </div>
          </div>
        </div>

        <div id="view-mode" class="settings-view hidden">
          <button class="back-btn" title="Zurück">⬅</button>
          <button class="close-btn close-all-btn" title="Schließen">✖</button>
          <h2>Modus & Dauer</h2>
          <div class="settings-layout">
            <div class="setting-section">
              <h3>Modus</h3>
              <div class="setting-group" id="mode-select">
                <button class="mode-btn active" data-mode="time">Zeit</button>
                <button class="mode-btn" data-mode="words">Wörter</button>
              </div>
            </div>
            <div class="setting-section">
              <h3>Dauer / Anzahl</h3>
              <div class="setting-group" id="value-select">
                <button class="val-btn active" data-val="5">5</button>
                <button class="val-btn" data-val="10">10</button>
                <button class="val-btn" data-val="20">20</button>
                <button class="val-btn" data-val="30">30</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="result-modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-modal" class="close-btn" title="Schließen">✖</button>
        <h2>Spiel beendet!</h2>

        <div class="result-stats">
          <div class="stat-box">
            <div class="stat-label">WPM</div>
            <div id="final-wpm" class="stat-value wpm-color">0</div>
          </div>

          <div class="stat-box">
            <div class="stat-label">Genauigkeit</div>
            <div id="final-acc" class="stat-value">100%</div>
          </div>

          <div class="stat-box">
            <div class="stat-label">Fehler</div>
            <div id="final-errors" class="stat-value error-color">0</div>
          </div>
        </div>

        <button id="modal-restart-btn" class="btn-primary mt-4">
          <span class="icon">↻</span> Neue Runde
        </button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
