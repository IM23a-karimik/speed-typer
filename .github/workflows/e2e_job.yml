name: E2E Test Suite

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    e2e-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Wait until Ready
              run: echo "Frontend is ready for E2E testing..."

            - name: Setup Chrome
              uses: browser-actions/setup-chrome@latest

            - name: Run E2e-Tests
              run: npx testcafe "chrome:headless --no-sandbox" philosophy.e2e.js
